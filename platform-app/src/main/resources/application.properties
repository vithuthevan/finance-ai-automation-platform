spring.application.name=finance-platform

# PostgreSQL (update credentials for your environment)
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_platform
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT (use a strong base64-encoded secret in production; minimum 256 bits / 32 bytes)
app.jwt.secret=Zm9yLWRldmVsb3BtZW50LXVzZS1hLXN0cm9uZy1iYXNlNjQtZW5jb2RlZC1zZWNyZXQta2V5
app.jwt.expiration-ms=3600000
app.jwt.issuer=finance-platform
