# Separate-host frontend. Browser calls a configured API base URL
# (see frontend/src/assets/config.json). No /api proxy.
server {
  listen 80;
  server_name _;
  autoindex off;
  server_tokens off;
  client_max_body_size 20m;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
