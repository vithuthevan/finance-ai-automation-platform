# Production profile. Unresolved placeholders fail startup — no secret fallbacks.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    com.finance.platform: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  auth:
    email-verification-required: ${APP_AUTH_EMAIL_VERIFICATION_REQUIRED:true}
    cookie:
      secure: ${APP_AUTH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  email:
    provider: ${APP_EMAIL_PROVIDER}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}
  storage:
    provider: ${APP_STORAGE_PROVIDER:${STORAGE_PROVIDER:s3}}
    max-file-size-mb: ${DOCUMENT_MAX_FILE_SIZE_MB:0}
    local:
      root: ${APP_STORAGE_LOCAL_ROOT:${STORAGE_LOCAL_PATH:/data/uploads}}
