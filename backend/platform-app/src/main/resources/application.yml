spring:
  application:
    name: finance-platform
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Colombo
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}
    issuer: ${APP_JWT_ISSUER:finance-platform}
  storage:
    provider: ${APP_STORAGE_PROVIDER:${STORAGE_PROVIDER:local}}
    max-file-size-mb: ${DOCUMENT_MAX_FILE_SIZE_MB:0}
    max-file-size-bytes: ${APP_STORAGE_MAX_BYTES:15728640}
    local:
      root: ${APP_STORAGE_LOCAL_ROOT:${STORAGE_LOCAL_PATH:./data/storage}}
    s3:
      bucket: ${APP_STORAGE_S3_BUCKET:}
      region: ${APP_STORAGE_S3_REGION:ap-south-1}
      endpoint: ${APP_STORAGE_S3_ENDPOINT:}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:}
  ai:
    enabled: ${APP_AI_ENABLED:false}
    provider: ${APP_AI_PROVIDER:${DOCUMENT_EXTRACTION_PROVIDER:none}}
    extraction-provider: ${DOCUMENT_EXTRACTION_PROVIDER:${APP_AI_PROVIDER:none}}
    accounting-provider: ${ACCOUNTING_AI_PROVIDER:${APP_AI_PROVIDER:none}}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:45}
    max-retries-per-document: ${APP_AI_MAX_RETRIES:5}
    openai:
      api-key: ${APP_AI_API_KEY:${AI_API_KEY:}}
      base-url: ${APP_AI_BASE_URL:${AI_BASE_URL:https://api.openai.com/v1}}
      model: ${APP_AI_MODEL:${AI_MODEL:gpt-4o-mini}}
  email:
    provider: ${APP_EMAIL_PROVIDER:log}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    tls: ${MAIL_TLS:true}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  subscription:
    default-plan: ${APP_DEFAULT_PLAN:STARTER}
    default-trial-days: ${APP_DEFAULT_TRIAL_DAYS:14}
    maintenance-cron: ${APP_SUBSCRIPTION_MAINTENANCE_CRON:0 30 7 * * *}
  platform:
    bootstrap-admin-email: ${APP_PLATFORM_ADMIN_BOOTSTRAP_EMAIL:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%thread] %logger{36} - %msg%n"
