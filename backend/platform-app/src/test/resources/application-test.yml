# Isolates tests from application-local.yml Postgres defaults.
spring:
  datasource:
    url: jdbc:h2:mem:finance_platform_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: Zm9yLXRlc3QtdXNlLWEtc3Ryb25nLWJhc2U2NC1lbmNvZGVkLXNlY3JldC1rZXk=
    expiration-ms: 3600000
    issuer: finance-platform-test
