spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

app:
  jwt:
    secret: Zm9yLXRlc3QtdXNlLWEtc3Ryb25nLWJhc2U2NC1lbmNvZGVkLXNlY3JldC1rZXk=
    expiration-ms: 3600000
    issuer: finance-platform-integration-test
  storage:
    provider: local
    local:
      root: ${java.io.tmpdir}/finance-platform-test-storage
  ai:
    enabled: false
    provider: mock
    extraction-provider: mock
  email:
    provider: log
  platform:
    bootstrap-admin-email:
