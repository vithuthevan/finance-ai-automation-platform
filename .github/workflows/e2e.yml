name: E2E

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "demo/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "e2e/**"
      - "demo/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: finance_platform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/finance_platform_ci
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ci_e2e_password
      APP_JWT_SECRET: ci-e2e-jwt-secret-not-for-production-use-32b
      APP_CORS_ALLOWED_ORIGINS: http://localhost:4200
      APP_AUTH_COOKIE_SECURE: "false"
      APP_PLATFORM_ADMIN_BOOTSTRAP_EMAIL: priya@harborledger.demo
      APP_AI_ENABLED: "false"
      APP_EMAIL_PROVIDER: log
      APP_STORAGE_PROVIDER: local
      APP_STORAGE_LOCAL_ROOT: /tmp/finance-e2e-uploads
      APP_FRONTEND_BASE_URL: http://localhost:4200
      E2E_BASE_URL: http://localhost:4200

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend
        working-directory: backend
        run: ./gradlew :platform-app:bootJar --no-daemon -x test

      - name: Start backend
        working-directory: backend
        run: |
          mkdir -p /tmp/finance-e2e-uploads
          nohup java -jar platform-app/build/libs/*.jar > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health/ready; then
              echo "Backend ready"
              exit 0
            fi
            sleep 5
          done
          echo "Backend failed to start"
          cat /tmp/backend.log || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200/; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend failed to start"
          cat /tmp/frontend.log || true
          exit 1

      - name: Seed isolated demo data
        run: python demo/seed_demo.py --base-url http://localhost:8080

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-service-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 3
