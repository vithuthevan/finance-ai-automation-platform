name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Backend Unit Tests
        run: ./gradlew :module-auth:test :module-finance:test --no-daemon
      - name: Flyway Fresh-DB Validation
        run: ./gradlew :platform-app:flywayIntegrationTest --no-daemon
      - name: PostgreSQL Integration Tests
        run: ./gradlew :platform-app:postgresIntegrationTest --no-daemon
      - name: Tenant Security Tests
        run: ./gradlew :platform-app:tenantSecurityIntegrationTest --no-daemon
      - name: Assemble backend
        run: ./gradlew :platform-app:bootJar --no-daemon
